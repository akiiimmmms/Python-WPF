[project]
name = "fastapi-crud-server"
version = "0.1.0"
description = "Ein kleiner FastAPI-Server mit CRUD-Funktionalität"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "loguru>=0.6.0",
    "sqlite3; python_version < '3.0'", # SQLite ist in Python standardmäßig enthalten, aber gut zu erwähnen
]
[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
]

[project.scripts]
start-server = "crud.__main__:run"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crud"]

